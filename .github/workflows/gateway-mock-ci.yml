name: Gateway mock CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-ci:
    name: gateway/mock-ci
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Produce the chosen CI result
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ci-result.txt ]]; then
            echo "::error::Missing ci-result.txt; expected pass, fail, or slow-pass."
            exit 1
          fi
          mode="$(cat ci-result.txt)"
          mode="${mode%$'\r'}"
          case "$mode" in
            pass)
              echo "Mock CI passed."
              ;;
            fail)
              echo "::error::Intentional mock CI failure."
              exit 1
              ;;
            slow-pass)
              echo "Keeping the check in progress for 30 seconds."
              sleep 30
              echo "Mock CI passed after the delay."
              ;;
            *)
              echo "::error::Invalid ci-result.txt; expected pass, fail, or slow-pass."
              exit 1
              ;;
          esac
